name: Sync official Facebook Page posts
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: find-cash-meta-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read only owner-approved public posts
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          if [ -z "$META_PAGE_ID" ] || [ -z "$META_PAGE_ACCESS_TOKEN" ]; then
            echo 'Page API not authorized, leaving the public feed unchanged.'
            exit 0
          fi
          node scripts/sync-facebook.mjs
      - name: Commit changes to authorized public feed
        run: |
          if git diff --quiet -- site/updates.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/updates.json
          git commit -m 'Refresh official Find The Cash NZ Page feed'
          git push
