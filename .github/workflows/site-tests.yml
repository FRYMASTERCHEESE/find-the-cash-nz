name: Find The Cash NZ website checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test website, owner map and Page feed safety
        run: npm run check
      - name: Test single-town publishing without live geocoding
        run: python3 -m unittest discover -s tests -p 'test_hunt_town.py' -v
